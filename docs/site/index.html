<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>duskecho.com</title>
  <meta name="description" content="duskecho 的个人技术学习与项目记录站点。">
  <meta name="theme-color" content="#0f0f12">
  <style>
    :root { color-scheme: dark light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", Roboto, sans-serif;
      background: #0f0f12;
      color: #e6e6e6;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    @media (prefers-color-scheme: light) {
      body { background: #fafafa; color: #1a1a1a; }
      .card { background: #fff; border-color: #eaeaea; }
      .card:hover { border-color: #d97757; }
      .muted { color: #888; }
      .accent { color: #c9582a; }
      a { color: #c9582a; }
      .divider { border-color: #eaeaea; }
    }
    main {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: clamp(48px, 10vh, 96px) 24px 32px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    header { margin-bottom: 56px; }
    .accent {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: #d97757;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 0;
      color: #888;
      font-size: 15px;
    }
    h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #888;
      margin: 0 0 16px;
    }
    .muted { color: #888; }
    a {
      color: #d97757;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }
    a:hover { opacity: 0.8; }
    .card {
      display: block;
      padding: 20px 22px;
      background: #15151a;
      border: 1px solid #2a2a30;
      border-radius: 12px;
      color: inherit;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .card:hover {
      border-color: #d97757;
      transform: translateY(-1px);
    }
    .card-title {
      font-size: 17px;
      font-weight: 600;
      margin: 0 0 4px;
      color: inherit;
    }
    .card-desc {
      margin: 0;
      font-size: 14px;
      color: #888;
    }
    .card-meta {
      margin-top: 12px;
      display: flex;
      gap: 14px;
      font-size: 13px;
    }
    .card-meta a {
      color: #888;
      border-bottom: 1px solid transparent;
    }
    .card-meta a:hover { color: #d97757; border-bottom-color: currentColor; opacity: 1; }
    .divider {
      border: none;
      border-top: 1px solid #2a2a30;
      margin: 56px 0 24px;
    }
    footer {
      padding: 0 24px 32px;
      text-align: center;
      font-size: 12px;
      color: #666;
    }
    footer .line { margin: 4px 0; }
    footer a {
      color: #888;
      border-bottom: 1px dotted transparent;
    }
    footer a:hover { color: #d97757; border-bottom-color: currentColor; }
    @media (max-width: 480px) {
      main { padding-top: 56px; }
      header { margin-bottom: 40px; }
    }
  </style>
</head>
<body>

<main>
  <header>
    <span class="accent">duskecho.com</span>
    <h1>duskecho</h1>
    <p class="subtitle">个人技术学习与项目记录 · Personal notes &amp; side projects.</p>
  </header>

  <section>
    <h2>项目</h2>
    <a class="card" href="/skiller/">
      <p class="card-title">Skiller</p>
      <p class="card-desc">浏览 AI 智能体公开技能的 iOS 应用，独立开发者作品。</p>
      <div class="card-meta">
        <a href="/skiller/privacy.html">隐私政策</a>
        <a href="/skiller/terms.html">用户协议</a>
      </div>
    </a>
  </section>

  <hr class="divider">

  <section>
    <h2>联系</h2>
    <p class="muted" style="margin:0;font-size:14px;">
      <a href="mailto:handwanly@gmail.com">handwanly@gmail.com</a>
    </p>
  </section>
</main>

<footer>
  <p class="line">
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">黔ICP备2025060250号-2</a>
  </p>
  <p class="line">© duskecho.com</p>
</footer>

</body>
</html>
